[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-problem-compiler"
version = "0.1.0"
description = "Evidence-grounded scientific question planning without executing calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
spc = "spc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spc = [
  "domain_packs/base/*.yaml",
  "domain_packs/fischer_tropsch/*.yaml",
  "adapters/catalogs/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
